name: "AI Code Reviewer"
description: "CodeRabbit-style AI reviews on every pull request and commit, powered by Claude"
author: "your-org"
branding:
  icon: "eye"
  color: "orange"
inputs:
  api_key:
    description: "z.ai API key (store as a secret). Legacy alias: anthropic_api_key."
    required: true
  base_url:
    description: "Anthropic-compatible API base URL. Defaults to z.ai's endpoint."
    required: false
    default: "https://api.z.ai/api/anthropic"
  github_token:
    description: "GitHub token with pull-requests: write and issues: write"
    required: true
    default: ${{ github.token }}
  model:
    description: "Model id (e.g. glm-5.2, glm-4.6). z.ai GLM via the Anthropic-compatible endpoint."
    required: false
    default: "glm-5.2"
  config_path:
    description: "Path to the .aireviewer.yaml config file in the repo"
    required: false
    default: ".aireviewer.yaml"
  max_files:
    description: "Maximum number of files to review per run"
    required: false
    default: "50"
  review_profile:
    description: "Default review profile: quiet | chill | assertive"
    required: false
    default: "chill"
runs:
  using: "node20"
  main: "dist/index.js"
