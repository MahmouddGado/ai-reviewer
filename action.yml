name: "AI Code Reviewer"
description: "CodeRabbit-style AI reviews on every pull request and commit, powered by Claude"
author: "MahmouddGado"
branding:
  icon: "eye"
  color: "orange"
inputs:
  api_key:
    description: "z.ai API key (store as a secret). Legacy alias: anthropic_api_key."
    required: true
  base_url:
    description: "Anthropic-compatible API base URL. Defaults to z.ai's endpoint."
    required: false
    default: "https://api.z.ai/api/anthropic"
  github_token:
    description: "GitHub token with pull-requests: write and issues: write"
    required: true
    default: ${{ github.token }}
  model:
    description: "Model id (e.g. glm-5.2, glm-4.6). z.ai GLM via the Anthropic-compatible endpoint."
    required: false
    default: "glm-5.2"
  config_path:
    description: "Path to the .aireviewer.yaml config file in the repo"
    required: false
    default: ".aireviewer.yaml"
  # These deliberately have no `default:` — an input default would always beat
  # the repo's .aireviewer.yaml. Unset means "use the yaml, else the built-in".
  max_files:
    description: "Maximum files to review per run. 0 = no limit. Built-in default: 0 (review every changed file)."
    required: false
  batch_chars:
    description: "Chars of diff per model request. Files are split across as many requests as needed; this never reduces how much is reviewed. Built-in default: 200000."
    required: false
  max_output_tokens:
    description: "Output token cap per model request. Raise if reviews look cut off. Built-in default: 32000."
    required: false
  review_generated:
    description: "Also review lock files, minified bundles, dist/, and snapshots. Built-in default: false."
    required: false
  review_profile:
    description: "Default review profile: quiet | chill | assertive"
    required: false
    default: "chill"
runs:
  using: "node20"
  main: "dist/index.js"
