# Copy this into a consuming repo at: .github/workflows/ai-review.yml
name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: your-org/ai-reviewer@v1
        with:
          api_key: ${{ secrets.ZAI_API_KEY }}          # z.ai API key
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: glm-5.2                                # z.ai GLM 5.2
          # base_url defaults to https://api.z.ai/api/anthropic
