# Copy to the ROOT of a consuming repo as `.aireviewer.yaml`. All keys are optional.
profile: chill               # quiet | chill | assertive
max_files: 0                 # 0 = no limit; review every changed file
batch_chars: 200000          # diff chars per model request (files are split, never dropped)
review_generated: false      # true also reviews lock files, dist/, minified bundles

auto_review:
  enabled: true
  drafts: false
  base_branches: ["main", "master", "release/.*"]   # regex, anchored
  ignore_title_keywords: ["WIP", "[skip review]"]

path_filters:
  - "!**/*.lock"
  - "!dist/**"
  - "!**/__generated__/**"

path_instructions:
  - path: "src/api/**"
    instructions: "Require input validation and typed error handling."
  - path: "**/*.test.ts"
    instructions: "Flag missing edge-case assertions."

verification: true
